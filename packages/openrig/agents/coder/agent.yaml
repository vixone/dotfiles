name: devrig
version: "1.0"
description: Personal coding agent. Edits and tests code through sandboxed worktrees.

defaults:
  runtime: pi
  lifecycle:
    execution_mode: interactive_resident
    compaction_strategy: default-compaction
    restore_policy: resume_if_possible

profiles:
  default:
    uses:
      skills: []
      guidance: []
      subagents: []
      plugins: []
      runtime_resources: []

resources: {}

startup:
  files: []
  actions: []
