# tmux config for the rig's private tmux server (TMUX_TMPDIR=~/.devrig/tmux, HOME=daemon-home).
# Installed by `bin/devrig provision` as daemon-home/.tmux.conf. Your ~/.tmux.conf is not used.

# Pi needs CSI-u extended keys to tell Shift+Enter and Ctrl+Enter from Enter (Pi docs/tmux.md).
set -g extended-keys on
set -g extended-keys-format csi-u
# Herdr attaches as TERM=xterm-256color (libghostty), which tmux does not credit with extended keys. Without
# extkeys tmux never sends Herdr CSI > 4;2 m and modified punctuation arrives as legacy bytes. Herdr 0.8.2
# still drops Ctrl from Ctrl+., so WezTerm sends Alt+. instead and keybindings.json binds both to jump-to-latest.
# A remap extension cannot do it: Pi's alt-screen reads scroll keys before extension input listeners run.
set -as terminal-features 'xterm*:extkeys'
# Wheel scrolling and focus tracking inside the Herdr tiles.
set -g mouse on
set -g focus-events on
